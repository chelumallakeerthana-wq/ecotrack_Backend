# ==============================================================
# Cloud Database Configuration (PostgreSQL / MySQL / AWS RDS / GCP / Supabase)
# Activate with: --spring.profiles.active=cloud
# Or set env vars: SPRING_PROFILES_ACTIVE=cloud
# ==============================================================

server.port=8081

# Cloud Database URL (Defaults to PostgreSQL, can be configured via environment variables)
# Examples:
# AWS RDS / Neon / Supabase: jdbc:postgresql://<host>:5432/<dbname>
# GCP Cloud SQL MySQL: jdbc:mysql://<host>:3306/<dbname>
spring.datasource.url=${DATABASE_URL:jdbc:postgresql://localhost:5432/ecotrack}
spring.datasource.username=${DATABASE_USER:postgres}
spring.datasource.password=${DATABASE_PASSWORD:postgres}

# Auto-detect driver from JDBC URL
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.open-in-view=false
spring.jpa.properties.hibernate.format_sql=true
